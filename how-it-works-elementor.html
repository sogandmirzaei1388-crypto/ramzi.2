<!doctype html>
<html lang="fa" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAMZI AERO service cards</title>
<style>
/* Service cards styled in the How It Works reference layout */
.sj-how-section {
  --sj-how-card: #fff;
  --sj-how-ink: #20272a;
  --sj-how-muted: #788187;
  --sj-how-gold: #bd9a68;
  --sj-how-en: var(--en-font, "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
  --sj-how-fa: var(--fa-font, "Vazirmatn", Tahoma, sans-serif);
  width: min(92%, 1420px);
  margin: 30px auto 72px;
  color: var(--sj-how-ink);
}
.sj-how-steps {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: clamp(16px, 2vw, 28px);
  margin: 0;
  padding: 0;
}
.sj-how-step {
  display: flex;
  min-width: 0;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.88);
  border-radius: 22px;
  background: var(--sj-how-card);
  box-shadow: 0 16px 42px rgba(35, 38, 40, .09), inset 0 1px rgba(255,255,255,.9);
  color: inherit;
  text-decoration: none;
  transition: transform .35s ease, box-shadow .35s ease, opacity .55s ease;
}
.sj-how-photo {
  display: block;
  width: 100%;
  aspect-ratio: 1.6 / 1;
  object-fit: cover;
  transition: transform .65s cubic-bezier(.2,.7,.2,1);
}
.sj-how-content {
  position: relative;
  display: flex;
  min-height: 152px;
  flex: 1;
  flex-direction: column;
  align-items: flex-start;
  padding: 19px 22px 20px;
}
.sj-how-content h2 {
  margin: 0 0 10px;
  font-family: var(--sj-how-en);
  font-size: clamp(18px, 1.5vw, 22px);
  font-weight: 600;
  letter-spacing: -.025em;
  line-height: 1.25;
}
.sj-how-content p {
  width: 100%;
  margin: 0;
  padding-bottom: 35px;
  color: var(--sj-how-muted);
  font-family: var(--sj-how-fa);
  font-size: 14px;
  line-height: 1.8;
  text-align: right;
}
.sj-how-arrow {
  position: absolute;
  bottom: 18px;
  left: 22px;
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  border: 1px solid rgba(189,154,104,.58);
  border-radius: 50%;
  color: #9b7542;
  font-family: var(--sj-how-en);
  font-size: 19px;
  line-height: 1;
  transition: color .25s ease, background .25s ease, transform .25s ease;
}
.sj-how-step:hover,
.sj-how-step:focus-visible {
  transform: translateY(-6px);
  box-shadow: 0 24px 54px rgba(35,38,40,.15);
}
.sj-how-step:hover .sj-how-photo,
.sj-how-step:focus-visible .sj-how-photo { transform: scale(1.035); }
.sj-how-step:hover .sj-how-arrow,
.sj-how-step:focus-visible .sj-how-arrow {
  transform: translateX(3px);
  background: var(--sj-how-gold);
  color: #fff;
}
.sj-how-step:focus-visible { outline: 3px solid rgba(189,154,104,.6); outline-offset: 4px; }
.sj-how-offscreen .sj-how-step { opacity: 0; transform: translateY(20px); }
.sj-how-offscreen .sj-how-step:nth-child(2) { transition-delay: .08s; }
.sj-how-offscreen .sj-how-step:nth-child(3) { transition-delay: .16s; }
@media (max-width: 900px) {
  .sj-how-steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sj-how-step:last-child { grid-column: 1 / -1; }
  .sj-how-step:last-child .sj-how-photo { aspect-ratio: 2.1 / 1; }
}
@media (max-width: 640px) {
  .sj-how-section { width: calc(100% - 28px); margin: 22px auto 48px; }
  .sj-how-steps { grid-template-columns: 1fr; gap: 15px; }
  .sj-how-step:last-child { grid-column: auto; }
  .sj-how-step:last-child .sj-how-photo,
  .sj-how-photo { aspect-ratio: 1.55 / 1; }
  .sj-how-content { min-height: 137px; padding: 17px 18px 18px; }
  .sj-how-content h2 { font-size: 20px; }
  .sj-how-content p { font-size: 13px; }
  .sj-how-arrow { left: 18px; bottom: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .sj-how-section *, .sj-how-section *::before, .sj-how-section *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}

body { margin: 0; background: #dacfc0; }
</style>
</head>
<body>
<section class="sj-how-section sj-how-offscreen" id="sj-how" aria-label="RAMZI AERO services">
        <div class="sj-how-steps">
          <a class="sj-how-step" id="flight-training" href="flight-training.html" aria-label="اطلاعات آموزش خلبانی فوق‌سبک">
            <img class="sj-how-photo" src="public/images/service-training.png" alt="هواپیما بر فراز ابرها هنگام طلوع آفتاب" loading="lazy" />
            <div class="sj-how-content">
              <h2>Ultralight Flight Training</h2>
              <p lang="fa" dir="rtl">از نخستین پرواز تا آغاز مسیر حرفه‌ای شما.</p>
              <span class="sj-how-arrow" aria-hidden="true">→</span>
            </div>
          </a>

          <a class="sj-how-step" id="aviation-english" href="aviation-english.html" aria-label="Aviation English">
            <img class="sj-how-photo" src="public/images/service-aviation-english.png" alt="هواپیمای مسافربری در غروب فرودگاه" loading="lazy" />
            <div class="sj-how-content">
              <h2>Aviation English</h2>
              <p lang="fa" dir="rtl">با زبان هوانوردی، مطمئن و جهانی پرواز کنید.</p>
              <span class="sj-how-arrow" aria-hidden="true">→</span>
            </div>
          </a>

          <article class="sj-how-step" id="private-jet">
            <img class="sj-how-photo" src="public/images/service-private-jet.png" alt="جت شخصی لوکس روی باند فرودگاه در غروب" loading="lazy" />
            <div class="sj-how-content">
              <h2>Private Jet</h2>
              <p lang="fa" dir="rtl">آزادی بیشتر، آسودگی کامل؛ رسیدن با سبک شما.</p>
              <span class="sj-how-arrow" aria-hidden="true">→</span>
            </div>
          </article>
        </div>
      </section>
<script>
(() => {
  const howSteps = document.querySelector(".sj-how-steps");
  const howSection = document.querySelector(".sj-how-section");
  if (!howSteps || !howSection) return;

  if (!("IntersectionObserver" in window)) {
    howSection.classList.remove("sj-how-offscreen");
    return;
  }

  new IntersectionObserver(([entry]) => {
    howSection.classList.toggle("sj-how-offscreen", !entry.isIntersecting);
  }).observe(howSteps);
})();
</script>
</body>
</html>
